<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .start-btn{
            color: white;
            background-color: rgb(183, 132, 231);
            height: 40px;
            width: 120px;
            margin-right: 8px;
            cursor: pointer;
            border: none;
            font-weight: bold;
            border-radius: 5px;
            transition: background-color 0.15s;
    }
    .start-btn:hover{
         background-color: rgb(99, 60, 156);
    }
    .download-btn{
        color: rgb(108,117,125);
        background-color: white;
        border-width: 2px;
        border-style: solid;
        height: 40px;
        width: 100px;
        font-weight: bold;
        border-radius: 4px;
        cursor: pointer;
        transition: background-color 0.15s,
        color 0.15s;

    }
    .download-btn:hover{
        background-color: rgb(108, 117, 125);
        color: white;
    }
    </style>
</head>
<body>
    <button class="start-btn">Get started</button><button class="download-btn">Download</button>
</body>
</html>
