<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .apply-btn{
          color: white;
          background-color: rgb(37, 124, 231);  
          font-weight: bold;
          height: 40px;
          width: 190px;
          border: none;
          border-radius: 30px;
          cursor: pointer;
            margin-right: 8px;
         transition: background-color 0.15s;
        }
        .apply-btn:hover{
            background-color: rgb(2, 70, 138);
        }
        .save-btn{
            color: rgb(10, 102, 194);
            background-color: white;
            border-style: solid;
            border-color: rgb(10,102,194);
            height: 40px;
            width: 80px;
            font-weight: bold;
            font-size: 15px;
            border-radius: 20px;
            cursor: pointer;
            transition: background-color 0.15s,
           border-width 0.15s;
        }
        .save-btn:hover{
            background-color: rgb(226, 240, 254);
            border-width: 2px;;
        }
    </style>
</head>
<body>
    <button class="apply-btn">Apply on company website</button><button class="save-btn">Save</button>
</body>
</html>
