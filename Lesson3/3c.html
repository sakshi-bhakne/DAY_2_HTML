<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .sign-up-btn{
            color: white;
            background-color: rgb(27, 163, 27);
            font-weight: bold;
            border: none;
            border-radius: 6px;
            height: 40px;
            width: 100px;
            font-size: 15px;
            cursor: pointer;
            transition: box-shadow 0.15s;
        }
        .sign-up-btn:hover{
            box-shadow: 0px 5px 8px rgba(0, 0, 0, 0.15);
        }
    </style>
</head>
<body>
    <button class="sign-up-btn">Sign up</button>
</body>
</html>
