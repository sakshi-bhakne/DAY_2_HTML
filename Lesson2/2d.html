<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .start-btn{
            background-color: rgb(121,82,179);
            color: white;
            font-size: 15px;
            border: none;
            border-radius: 3px;
            height: 40px;
            width: 100px;
            cursor: pointer;
            margin-right: 6px;
        }
    .Download-btn{
    background-color: white;
    color: rgb(108, 117, 125);
    border-width: 1px;
    border-style: solid;
    border-color: rgb(108, 117, 125);
    height: 40px;
    width: 100px;
    font-weight: bold;
    border-radius: 4px;
    cursor: pointer;
    }
    </style>
</head>
<body>
    <button class="start-btn">Get started</button><button class="Download-btn">Download</button>
</body>
</html>
