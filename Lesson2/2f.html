<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .amazon-link{
          color: rgb(0, 113, 133);  
        }
        .p1{
            font-size: 24px;
            font-weight: bold;
        }
        .p2{
            color: rgb(17, 162, 17);
            font-weight: bold;
            font-size: large;
        }
        .cart-btn{
            background-color:rgb(237, 226, 20) ;
            border:none;
            height: 35px;
            width: 100px;
            border-radius: 15px;
            margin-right: 10px;
            cursor: pointer;
        }
        .buy-btn{
            background-color: rgb(255, 164, 28);
            border: none;
            height: 35px;
            width: 100px;
            border-radius: 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <a href="https://www.amazon.in/" class="amazon-link">Back to Amazon</a>
    <p class="p1">Nike Black Running Shoes</p>
    <p class="p2">$39 - in stock</p>
    <p class="p3">Free delievry tomorrow</p>
    <button class="cart-btn">Add to Cart</button><button class="buy-btn">Buy now</button>
</body>
</html>
