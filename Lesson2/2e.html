<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .apply-btn
    {
        color: white;
        background-color: rgb(10,102,194);
        border: none;
        height: 40px;
        width: 240px;
        font-weight: bold;
        font-size: 15px;
        border-radius: 20px;
        cursor: pointer;
        margin-right: 8px;
    }
    .save-btn
    {
      height: 40px;
        width: 110px;
        font-weight: bold;
        font-size: 15px;
        border-radius: 20px;
        cursor: pointer;
        margin-right: 8px;
        border: solid  rgb(10,102,194) ;
        color: rgb(10,102,194);
    }
    </style>
</head>
<body>
    <button class="apply-btn">Apply on company website</button><button class="save-btn">Save</button>
</body>
</html>
